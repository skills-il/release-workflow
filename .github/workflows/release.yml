name: Reusable release with Sigstore attestation

on:
  workflow_call:
    inputs:
      subject_path:
        description: |
          Newline-separated globs of files to attest. Defaults to skill files.
          Must be newline-separated (use a YAML `|` block); space-separated
          values are not supported by actions/attest-build-provenance.
        type: string
        required: false
        default: |
          **/SKILL.md
          **/SKILL_HE.md
          **/metadata.json
          **/scripts/**

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Create GitHub Release
        # softprops/action-gh-release@v2
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          generate_release_notes: true
      - name: Attest build provenance
        # actions/attest-build-provenance@v2
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ inputs.subject_path }}
