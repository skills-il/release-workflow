name: Reusable release with Sigstore attestation

on:
  workflow_call:
    inputs:
      subject_path:
        description: |
          Newline-separated globs of files to attest. Defaults to skill files.
          Must be newline-separated (use a YAML `|` block); space-separated
          values are not supported by actions/attest-build-provenance.
        type: string
        required: false
        default: |
          **/SKILL.md
          **/SKILL_HE.md
          **/metadata.json

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Create GitHub Release
        # softprops/action-gh-release@v2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
      - name: Attest build provenance
        # actions/attest-build-provenance@v2
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: ${{ inputs.subject_path }}
